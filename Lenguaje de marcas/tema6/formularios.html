<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <fieldset>
            <legend>Formularios</legend>
            <label for="correo">Introduzca su correo</label>
            <input type="email" name="correo">
            <br>
            <label for="url">Introduzca una página web</label>
            <input type="url" name="url">
            <br>
            <label for="fecha">Introduzca una fecha:</label>
            <input type="date" name="fecha">
            <br>
            <label for="hora">Introduzca una hora:</label>
            <input type="time" name="hora">
            <br>
            <label for="fechahora">Introduzca una fecha y una hora</label>
            <input type="datetime" name="fechahora">
            <br>
            <label for="colorcito">Pintame algo</label>
            <input type="color" name="colorcito" >
            <br>
            <label for="rango">Mueve la barrita</label>
            <input type="range" name="rango" min="0" max="100">
            <br>
            <label for="progreso">Progreso actual:</label>
            <progress value="70" max="100"></progress>
            <br>
            <label for="usoCPU">Uso de tu CPU</label>
            <meter value="0.6" min="0" max="1" low="0.3" high="0.7"></meter>
            <br>
            <input type="submit" value="Enviar">
        </fieldset>
    </form>
</body>
</html>
